name: Stock Analyzer V6 checks
on:
  push:
    paths:
      - 'analyzer-by-kijungnam-v6c-0.1/**'
      - '.github/workflows/stock-analyzer-v6.yml'
  pull_request:
    paths:
      - 'analyzer-by-kijungnam-v6c-0.1/**'
      - '.github/workflows/stock-analyzer-v6.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analyzer-by-kijungnam-v6c-0.1
    env:
      ANALYZER_DB_FILE: /tmp/stock-analyzer-tests.sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: analyzer-by-kijungnam-v6c-0.1/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python verify_release.py
      - run: python -m unittest test_trade_engine test_calculations_v602 test_execution_engine test_scenario_engine test_scenario_ui
      - run: python smoke_test.py
      - run: python test_trade_ui.py
      - run: python test_analysis_ui.py
      - run: python test_execution_ui.py
