# Local Phase 0 scaffold. API is liveness-only; database wiring comes later.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: goldnam
      POSTGRES_USER: goldnam
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U goldnam -d goldnam"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    environment:
      DATABASE_URL: postgresql://goldnam@db:5432/goldnam
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports: ["127.0.0.1:3000:80"]
volumes:
  pgdata:
