[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "goldnam-sachs"
dynamic = ["version"]
description = "Goldnam Sachs calculation engine and local development scaffold"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.5.5",
  "pandas==3.1.1",
  "requests==2.34.2",
  "yfinance==1.8.0",
  "finance-datareader==0.9.202",
  "lxml==6.1.3",
  "exchange-calendars==4.13.3",
  "pyarrow==26.0.1",
  "sqlalchemy==2.1.9",
  "psycopg[binary]==3.3.9",
  "argon2-cffi==25.1.0",
  "defusedxml==0.7.1",
  "scipy==1.18.1",
  "pykrx==1.0.51",
  "setuptools==80.10.2",
]

[project.optional-dependencies]
api = [
  "fastapi==0.165.0",
  "uvicorn==0.54.0",
  "httpx==0.28.1"
]

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "pytest-socket==0.8.1",
  "hypothesis==6.170.17",
  "ruff==0.17.6",
  "mypy==2.4.1",
  "pandas-stubs==3.1.0.261029",
  "types-requests==2.33.0.20261030",
  "pyyaml==6.0.4",
  "jsonschema==4.26.0",
  "types-defusedxml==0.7.0.20260504",
]
legacy-ui = [
  "streamlit==1.67.0",
  "plotly==7.1.0"
]

[tool.hatch.version]
path = "engine/goldnam_engine/_version.py"
pattern = 'APP_VERSION = "(?P<version>[^\"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["engine/goldnam_engine"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["engine/tests", "api/tests"]
addopts = "-ra --disable-socket --allow-unix-socket -m 'not live'"
norecursedirs = ["legacy_ui", ".*", "node_modules", "__pycache__"]
markers = ["live: external provider integration (explicit opt-in)"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["engine/tests/legacy_ui"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["engine/goldnam_engine", "api", "jobs"]
exclude = ["api/tests"]

[[tool.mypy.overrides]]
module = ["FinanceDataReader", "yfinance", "pykrx", "exchange_calendars"]
ignore_missing_imports = true
